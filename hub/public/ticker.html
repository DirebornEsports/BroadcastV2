<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/vendor/anime.umd.min.js"></script><script src="/ui/motion.js"></script>
<script src="/theme.js"></script>
<title>Running Text</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #e9c679; --gold-hi: #f8e6ad; --teal: #5fd4a4; --text: #f3eee2; --muted: #c9c2ae; --red: #e0483a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: Poppins, "Segoe UI", sans-serif; color: var(--text); }
  body.bg { background: #222 url(/assets/clouds.jpg) center / cover; }
  #fit { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(var(--k, 1)); }

  .bar { position: absolute; left: 40px; right: 40px; bottom: var(--bottom, 40px); height: 66px; display: flex; filter: drop-shadow(0 8px 18px rgba(0,0,0,.5)); }
  .badge { position: relative; z-index: 2; display: flex; flex: none; height: 100%; }
  .badge span { display: flex; align-items: center; gap: 12px; padding: 0 22px; font: 900 30px/1 Poppins; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .badge .b1 { background: linear-gradient(180deg, #f6dd9c, #d6ad5e); color: #1b2a1f; border-radius: 8px 0 0 8px; }
  .badge .b2 { background: linear-gradient(180deg, #1f4c37, #123323); color: var(--gold-hi); border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold);
    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%); padding-right: 40px; }
  .badge .dot { width: 14px; height: 14px; border-radius: 50%; background: #1b2a1f; display: none; }
  .live .badge .b1 { background: linear-gradient(180deg, #ef5a4a, #c8352a); color: #fff; }
  .live .badge .dot { display: block; background: #fff; animation: blink 1s steps(2) infinite; }
  .track { position: relative; flex: 1; min-width: 0; margin-left: -18px; height: 100%; overflow: hidden; border-radius: 0 8px 8px 0;
    background: linear-gradient(180deg, rgba(16,44,31,.97), rgba(8,24,16,.97)); border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); }
  .track::before { content: ""; position: absolute; inset: 0; background: url(/assets/cloud-gold.png) right -40px center / 260px auto no-repeat; opacity: .06; pointer-events: none; }
  .track::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 60px; background: linear-gradient(90deg, rgba(10,28,19,1), transparent); pointer-events: none; }
  .run { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; white-space: nowrap; will-change: transform; padding-left: 40px; }
  .seq { display: flex; align-items: center; }
  .it { display: inline-flex; align-items: center; gap: 12px; font: 600 26px/1 Poppins; color: var(--text); }
  .it b { font-weight: 800; color: #fff; }
  .it .lb { font: 800 18px/1 Poppins; letter-spacing: .2em; text-transform: uppercase; color: var(--teal); }
  .it .muted { color: var(--muted); }
  .it .gold { color: var(--gold); font-weight: 800; }
  .it img, .it .lg { width: 38px; height: 38px; object-fit: contain; flex: none; }
  .it .lg { display: grid; place-items: center; border-radius: 6px; border: 1px solid rgba(233,198,121,.5); background: rgba(233,198,121,.12); font: 800 13px Poppins; color: var(--gold); }
  .it .vs { font: 900 italic 24px Poppins; color: var(--gold); }
  .it .cdx { display: inline-block; padding: 6px 14px; border-radius: 6px; background: linear-gradient(180deg, #f6dd9c, #d6ad5e); color: #1b2a1f; font: 800 24px/1 Poppins; font-variant-numeric: tabular-nums; }
  .it .cdx.live { background: var(--red); color: #fff; animation: blink 1.2s steps(2) infinite; }
  .it .win { color: var(--gold-hi); font-weight: 800; }
  .it .lose { color: var(--muted); }
  .sep { margin: 0 34px; color: var(--gold); font-size: 22px; }

  .bar { transform: translateY(160%); }
  .bar.in { animation: barIn .7s cubic-bezier(.16,1,.3,1) forwards; }
  .bar.out { animation: barOut .45s ease-in forwards; }
  @keyframes barIn { from { transform: translateY(160%); } to { transform: none; } }
  @keyframes barOut { from { transform: none; } to { transform: translateY(160%); } }
  .in .badge { animation: pop .6s cubic-bezier(.16,1,.3,1) both .35s; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  @keyframes blink { 50% { opacity: .4; } }
</style>
</head>
<body>
<div id="fit"></div>
<script src="/sfx.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('bg') === '1') document.body.classList.add('bg');
  const MUTE = q.get('mute') === '1';
  const fit = document.getElementById('fit');
  const resize = () => fit.style.setProperty('--k', Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener('resize', resize); resize();
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let T = null, D = null, offset = 0, bar = null, sig = null, anim = null;
  const logo = (t) => (t.tbd ? '<span class="lg">?</span>' : t.logo ? `<img src="${esc(t.logo)}" alt="" onerror="this.outerHTML='<span class=&quot;lg&quot;>${esc((t.tag || t.name).slice(0, 3).toUpperCase())}</span>'">`
    : `<span class="lg">${esc((t.tag || t.name.replace(/[^A-Za-z0-9]/g, '')).slice(0, 3).toUpperCase())}</span>`);
  const sep = '<span class="sep">❖</span>';

  function items() {
    const out = [];
    if (D && !D.none && T.showNext) {
      out.push(`<span class="it"><span class="lb">${esc(D.title || 'Next match')}</span>${logo(D.a)}<b>${esc(D.a.name)}</b><span class="vs">vs</span>${logo(D.b)}<b>${esc(D.b.name)}</b>
        <span class="muted">${esc([D.round, D.bo ? 'BO' + D.bo : ''].filter(Boolean).join(' · '))}</span>
        ${D.dayTxt ? `<span class="muted">${esc(D.dayTxt)}${D.time ? ` · <span class="gold">${esc(D.time)} ${esc(D.tz)}</span>` : ''}</span>` : ''}
        <span class="cdx" data-cd></span></span>`);
    }
    if (D && T.showUpcoming) for (const u of (D.upcoming || []).slice(0, 2)) {
      out.push(`<span class="it"><span class="lb">Selanjutnya</span><span class="muted">${esc(u.round)}</span>${logo(u.a)}<b>${esc(u.a.name)}</b><span class="vs">vs</span>${logo(u.b)}<b>${esc(u.b.name)}</b>${u.time ? `<span class="gold">${esc(u.dayTxt ? u.dayTxt.split(' · ')[1] + ' · ' : '')}${esc(u.time)} ${esc(D.tz)}</span>` : ''}</span>`);
    }
    if (D && T.showResults && (D.recent || []).length) {
      out.push(`<span class="it"><span class="lb">Hasil</span>${D.recent.slice(0, 3).map((r) =>
        `<span class="muted">${esc(r.round)}</span>${logo(r.a)}<span class="${r.winner === 'a' ? 'win' : 'lose'}">${esc(r.a.name)}</span><b class="gold">${r.score[0] ?? 0} – ${r.score[1] ?? 0}</b><span class="${r.winner === 'b' ? 'win' : 'lose'}">${esc(r.b.name)}</span>${logo(r.b)}`).join('<span class="sep" style="margin:0 18px">·</span>')}</span>`);
    }
    for (const m of T.messages || []) out.push(`<span class="it">${esc(m)}</span>`);
    return out;
  }

  function build() {
    const list = items();
    const want = T && T.visible && list.length;
    const live = !!(D && !D.none && D.live && T.showNext);
    const key = JSON.stringify([want, list, live, T && [T.label1, T.label2, T.speed, T.bottom]]);
    if (key === sig) return;
    const wasShown = !!bar && sig !== null && JSON.parse(sig)[0];
    sig = key;
    if (!want) { if (bar) { const old = bar; bar = null; old.classList.remove('in'); old.classList.add('out'); setTimeout(() => old.remove(), 500); if (!MUTE) SFX.play('overlay-out', 0, .6); } return; }
    const seq = list.join(sep) + sep;
    const html = `<div class="badge"><span class="b1"><i class="dot"></i>${esc(live ? 'Live' : T.label1)}</span><span class="b2">${esc(live ? 'Now' : T.label2)}</span></div>
      <div class="track"><div class="run"><div class="seq">${seq}</div><div class="seq">${seq}</div></div></div>`;
    fit.style.setProperty('--bottom', (T.bottom ?? 40) + 'px');
    if (bar) { bar.innerHTML = html; bar.classList.toggle('live', live); }
    else {
      bar = document.createElement('div'); bar.className = 'bar' + (live ? ' live' : ''); bar.innerHTML = html; fit.appendChild(bar);
      void bar.offsetWidth; bar.classList.add('in');
      if (!MUTE && wasShown === false && sig) SFX.play('overlay-in', 0, .6);
    }
    tick();
    // seamless loop: move one copy's width at the chosen speed, then repeat
    requestAnimationFrame(() => {
      const one = bar.querySelector('.seq');
      const w = one.getBoundingClientRect().width / (parseFloat(getComputedStyle(fit).getPropertyValue('--k')) || 1);
      if (anim) anim.cancel();
      anim = bar.querySelector('.run').animate([{ transform: 'translateX(0)' }, { transform: `translateX(${-w}px)` }], { duration: (w / (T.speed || 110)) * 1000, iterations: Infinity });
    });
  }

  function tick() {
    if (!bar || !D || D.none) return;
    let txt, cls = '';
    if (D.live) { txt = 'LIVE SEKARANG'; cls = 'live'; }
    else if (D.done) txt = 'SELESAI';
    else if (!D.startTs) txt = 'SEGERA';
    else {
      const left = Math.round((D.startTs - (Date.now() + offset)) / 1000);
      if (left <= 0) txt = 'SEGERA DIMULAI';
      else {
        const p = (n) => String(n).padStart(2, '0');
        txt = `MULAI DALAM ${p(Math.floor(left / 60))}:${p(left % 60)}`;
      }
    }
    bar.querySelectorAll('[data-cd]').forEach((el) => { if (el.textContent !== txt) el.textContent = txt; el.className = 'cdx ' + cls; });
  }
  setInterval(tick, 250);

  async function load() {
    try { D = await fetch('/api/nextmatch', { cache: 'no-store' }).then((r) => r.json()); offset = (D.serverNow || Date.now()) - Date.now(); } catch {}
    if (T) build();
  }
  setInterval(load, 20000);
  let ssig = null;
  function connect() {
    const es = new EventSource('/events');
    es.onmessage = (e) => {
      const S = JSON.parse(e.data);
      if (!MUTE) SFX.config(S.sfx, false);
      T = S.ticker;
      const s2 = JSON.stringify([S.nextMatch, S.statsVersion]);
      if (s2 !== ssig) { ssig = s2; load(); } else build();
    };
    es.onerror = () => { es.close(); setTimeout(connect, 2000); };
  }
  connect();
})();
</script>
</body>
</html>
