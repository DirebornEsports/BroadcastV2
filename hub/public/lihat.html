<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/vendor/anime.umd.min.js"></script><script src="/ui/motion.js"></script>
<script src="/theme.js"></script>
<script src="/ui/shell.js" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Cam · Direborn</title>
<style>
  :root { --bg: #0a1a12; --panel: #10291c; --line: rgba(214,189,134,.3); --gold: #d6bd86; --gold-hi: #f3e4b8; --text: #f4e8c6; --muted: #a9b59f; --bad: #e5604a; --ok: #6fd08c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 500 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 2px solid var(--gold); }
  h1 { margin: 0 auto 0 0; font-size: 14px; letter-spacing: 0; color: var(--gold-hi); }
  input, button { font: inherit; color: inherit; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line); background: #06120c; }
  button { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: var(--panel); font-weight: 600; cursor: pointer; }
  #msg { padding: 8px 16px; color: var(--muted); font-weight: 600; }
  #msg.err { color: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; padding: 14px 16px; }
  .cam { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .cam video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; display: block; }
  .cam .bar { display: flex; justify-content: space-between; padding: 8px 12px; font-weight: 600; }
  .cam .st { font-size: 12px; color: var(--muted); }
  .cam .st.ok { color: var(--ok); } .cam .st.bad { color: var(--bad); }
  .hear { background: none; border: 0; cursor: pointer; font-size: 15px; padding: 0 4px; }
</style>
<link rel="stylesheet" href="/ui/panel.css">
</head>
<body>
<header><h1>Cek cam pemain (tanpa delay)</h1><input id="key" type="password" placeholder="Kunci lihat"><button id="go">Lihat</button></header>
<div id="msg">Masukkan kunci lihat. Halaman ini buat ngecek cam sebelum live — delay & ganti cam otomatis ada di overlay OBS.</div>
<div class="grid" id="grid"></div>
<script src="/camrtc.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  try { $('key').value = localStorage.getItem('dbcam.view') || ''; } catch {}
  const conns = new Map();   // name -> { since, conn, el }
  let key = '', ice = null, timer = null;
  const msg = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };
  async function refresh() {
    let d;
    try { d = await DBCam.api(location.origin, '/api/cam/cams', { key }); }
    catch (e) { msg(e.message, true); return; }
    msg(d.cams.length ? `${d.cams.filter((c) => c.online).length} cam online` : 'Belum ada pemain yang mengirim cam.');
    const names = new Set(d.cams.map((c) => c.name));
    for (const [n, c] of conns) if (!names.has(n)) { c.conn && c.conn.close(); c.el.remove(); conns.delete(n); }
    for (const cam of d.cams) {
      let c = conns.get(cam.name);
      if (!c) {
        const el = document.createElement('div'); el.className = 'cam';
        el.innerHTML = `<video playsinline muted autoplay></video><audio autoplay muted></audio><div class="bar"><span>${esc(cam.name)}</span><button class="hear" type="button" title="Dengar mic (live, tanpa delay)">🔇</button><span class="st">…</span></div>`;
        const au = el.querySelector('audio'), hb = el.querySelector('.hear');
        hb.onclick = () => { au.muted = !au.muted; hb.textContent = au.muted ? '🔇' : '🔊'; au.play().catch(() => {}); };
        $('grid').appendChild(el);
        c = { since: 0, conn: null, el }; conns.set(cam.name, c);
      }
      const st = c.el.querySelector('.st');
      if (!cam.online) { st.textContent = 'offline'; st.className = 'st bad'; continue; }
      if (c.since === cam.since && c.conn && ['connected', 'connecting', 'new'].includes(c.conn.pc.connectionState)) continue;
      c.conn && c.conn.close(); c.since = cam.since;
      st.textContent = 'menyambung…'; st.className = 'st';
      try {
        c.conn = await DBCam.pull({ base: location.origin, key, name: cam.name, iceServers: ice,
          onTrack: (t) => { c.el.querySelector('video').srcObject = new MediaStream([t]); },
          onAudio: (t) => { c.el.querySelector('audio').srcObject = new MediaStream([t]); },
          onState: (s) => { st.textContent = s === 'connected' ? 'live' : s; st.className = 'st' + (s === 'connected' ? ' ok' : s === 'failed' ? ' bad' : ''); } });
      } catch (e) { st.textContent = e.message; st.className = 'st bad'; c.since = 0; }
    }
  }
  $('go').onclick = async () => {
    key = $('key').value.trim(); if (!key) return;
    try { localStorage.setItem('dbcam.view', key); } catch {}
    ice = await DBCam.getIce(location.origin, key);
    clearInterval(timer); await refresh(); timer = setInterval(refresh, 4000);
  };
  fetch('/api/cam/admin', { cache: 'no-store' }).then((r) => r.json()).then((d) => { if (d.ok && d.viewKey) { $('key').value = d.viewKey; $('go').click(); } else if ($('key').value) $('go').click(); }).catch(() => { if ($('key').value) $('go').click(); });
})();
</script>
</body>
</html>
