<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/vendor/anime.umd.min.js"></script><script src="/ui/motion.js"></script>
<script src="/theme.js"></script>
<title>Draft Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     DIRE BATTLE CUP — draft overlay (layout from the Direbattle mockup)
     Everything is laid out on a 1920-wide canvas and scaled to the source.
     ===================================================================== */
  :root {
    --left-rgb: 214, 189, 134;
    --right-rgb: 214, 189, 134;
    --bg-900: #0c1912;
    --bg-800: #12241a;
    --green-700: #1b3a2b;
    --green-600: #24503b;
    --gold: #d2b47a;
    --gold-hi: #f6e5b5;
    --gold-lo: #9c7a3f;
    --cream: #f6ecd2;
    --red: #e2483a;
    --display: "Oswald", "Bebas Neue", "Arial Narrow", sans-serif;
    --font: "Montserrat", "Segoe UI", system-ui, sans-serif;
    --bar-h: 307px;   /* side panel height (256) x 1.2 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color: var(--cream); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body.preview { background: radial-gradient(1400px 800px at 50% 30%, #4a4237, #1b1814); }

  .stage {
    position: absolute; left: 50%; bottom: 0; width: 1920px; height: 1080px;
    transform-origin: 50% 100%; transform: translateX(-50%) scale(var(--fit, 1));
    pointer-events: none;
  }
  .wrap { position: absolute; inset: 0; transition: transform .8s cubic-bezier(.16,1,.3,1), opacity .6s ease; }
  .wrap.hidden { transform: translateY(520px); opacity: 0; }

  /* =====================================================================
     The bar is built from the Direbattle assets in public/assets/bar/ on the
     1600 x 900 grid of the reference mockup, then scaled x1.2 to 1920 x 1080.
     All sizes below are in that 1600 grid (= the assets' own pixel sizes).
     ===================================================================== */
  .bar16 { position: absolute; left: 0; bottom: 0; width: 1600px; height: 360px; transform: scale(1.2); transform-origin: 0 100%; }
  .bar16 img { display: block; user-select: none; }

  /* side panels + corner clouds */
  .panel { position: absolute; top: 104px; width: 612px; height: 256px; z-index: 1; }
  .panel.left  { left: 0; }
  .panel.right { left: 988px; }
  .corner { position: absolute; top: 0; width: 330px; height: 114px; z-index: 2; }
  .corner.left  { left: 0; }
  .corner.right { right: 0; transform: scaleX(-1); }
  .corner img { position: absolute; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  .corner img { filter: brightness(.82) saturate(.95) drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  .corner .c1 { width: 196px; left: -62px; bottom: 16px; }   /* sits on top of the bar, clear of the panel edge */

  /* sides */
  .side { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .side .pick, .side .ban { position: absolute; }

  /* pick card: frame asset 110 x 162, artwork window 100 x 134 at (5,7), name plate at y 141-161 */
  .pick { position: relative; width: 110px; height: 162px; }
  .pick .clip { position: absolute; left: 5px; top: 7px; width: 100px; height: 134px; overflow: hidden;
    background: linear-gradient(118deg, #163a29 0%, #2a5b44 30%, #1c4231 46%, #2f624a 62%, #183c2c 100%); }
  .pick .clip::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; /* the soft diagonal sheen of the mockup */
    background: linear-gradient(118deg, transparent 20%, rgba(255,255,255,.06) 32%, transparent 44%, transparent 58%, rgba(255,255,255,.05) 66%, transparent 76%); }
  .pick.filled .clip::after { opacity: .5; }
  .pick .pframe { position: absolute; left: 0; top: 0; width: 110px; height: 162px; z-index: 6; pointer-events: none; }
  .pick .glow { position: absolute; left: 2px; top: 4px; width: 106px; height: 158px; border-radius: 3px; z-index: 0; pointer-events: none; }
  .pick .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: opacity .3s; }
  .pick .ph .mark { width: 50px; height: 62px; display: grid; place-items: center; }
  .pick .ph .mark img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  .pick .ph .chev { position: absolute; bottom: 12px; width: 34px; height: 14px; opacity: 0; }
  .pick.active .ph .chev { opacity: 1; animation: chev 1s ease-in-out infinite; }
  .pick.filled .ph { opacity: 0; }

  .pick .media { position: absolute; inset: 0; z-index: 1; transition: transform .7s cubic-bezier(.16,1,.3,1), filter .5s; }
  .pick .media > * { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; max-width: none; }
  .pick .media > .framed { object-fit: fill; }
  .pick .media > .full { object-fit: cover; object-position: 50% 50%; }
  .pick .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 42%; z-index: 2; background: linear-gradient(transparent, rgba(8,20,13,.85)); pointer-events: none; }

  /* player photo in the middle, hero slides left */
  .pick .pphoto { position: absolute; left: 50%; bottom: 0; height: 122px; width: 104px; z-index: 2; transform: translateX(-50%); opacity: 0; pointer-events: none; }
  .pick .pphoto img { width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
  .pick.has-photo .media { transform: translateX(-26%); filter: brightness(.8) saturate(.9); }
  .pick.has-photo .pphoto { opacity: 1; transition: opacity .3s; }
  .pick.photo-pop .pphoto { animation: photoIn .7s .15s cubic-bezier(.16,1,.3,1) both; }
  @keyframes photoIn { from { opacity: 0; transform: translate(-50%, 38px) scale(.92); } to { opacity: 1; transform: translateX(-50%); } }

  .pick .hname {
    position: absolute; left: 7px; right: 7px; bottom: 24px; z-index: 7; text-align: center;
    font: 600 10.5px/1.05 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--gold-hi);
    text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity .3s; white-space: normal; text-wrap: balance;
  }
  .pick.has-player .hname { opacity: 1; }
  body.no-names .pick .hname { display: none; }

  /* name on the frame's green plate */
  .plate {
    position: absolute; left: 9px; right: 9px; top: 143px; height: 17px; z-index: 7; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 6px; overflow: hidden;
    font: 600 13px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; color: var(--cream); text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .plate span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; }
  .plate.long span { font-size: 10.5px; }
  .plate .cb { display: none; flex: none; width: 12px; height: 12px; border-radius: 2px; background: var(--bg-900); color: var(--gold-hi); font: normal 900 8px/12px var(--font); text-align: center; text-shadow: none; }
  .plate.captain { background: linear-gradient(180deg, rgba(246,229,181,.72), rgba(210,180,122,.6)); color: #10241a; text-shadow: none; }
  .plate.captain .cb { display: inline-block; }
  .pick.player-pop .plate span { animation: widen .6s .1s cubic-bezier(.16,1,.3,1) both; }
  .pick.player-pop .plate::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -50%; background: linear-gradient(100deg, transparent, rgba(255,246,214,.85), transparent); transform: skewX(-20deg); animation: sweep .7s .25s ease-out; }
  @keyframes widen { from { opacity: 0; letter-spacing: .5em; } to { opacity: 1; letter-spacing: .03em; } }
  @keyframes sweep { from { left: -50%; } to { left: 120%; } }

  .pick .flash { position: absolute; left: 5px; top: 7px; width: 100px; height: 134px; z-index: 8; background: var(--gold-hi); opacity: 0; pointer-events: none; }
  .pick.pop .media { animation: heroIn .75s cubic-bezier(.16,1,.3,1); }
  .pick.pop .flash { animation: flash .55s ease-out; }
  .pick.pop { animation: bump .6s cubic-bezier(.16,1,.3,1); }

  /* ban tile: frame asset 77 x 47 */
  .ban { width: 77px; height: 47px; border-radius: 5px; }
  .ban .in { position: absolute; inset: 1px; border-radius: 4px; overflow: hidden; background: linear-gradient(180deg, #18241e, #121c17); }
  .ban .bframe { position: absolute; left: 0; top: 0; width: 77px; height: 47px; z-index: 3; pointer-events: none; }
  .ban .mark { position: absolute; inset: 0; display: grid; place-items: center; }
  .ban .mark img { max-height: 25px; max-width: 30px; object-fit: contain; opacity: .95; }
  .ban.filled .mark { display: none; }
  .ban .hero { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: sepia(1) saturate(1.4) hue-rotate(-18deg) brightness(.6) contrast(1.05); }
  .ban.pop .hero { animation: banIn .5s ease-out; }
  .ban .x { position: absolute; inset: 0; z-index: 2; display: none; }
  .ban.filled .x { display: block; }
  .ban .x i { position: absolute; left: 50%; top: 50%; width: 34px; height: 4.5px; margin: -2.25px 0 0 -17px; border-radius: 3px; background: linear-gradient(90deg, #ff7a5c, var(--red)); box-shadow: 0 0 8px rgba(226,72,58,.8); }
  .ban .x i:nth-child(1) { transform: rotate(45deg); }
  .ban .x i:nth-child(2) { transform: rotate(-45deg); }
  .ban.pop .x i:nth-child(1) { animation: slash1 .22s .18s cubic-bezier(.6,0,.4,1) both; }
  .ban.pop .x i:nth-child(2) { animation: slash2 .22s .38s cubic-bezier(.6,0,.4,1) both; }
  .ban.pop .x { animation: thud .35s .58s ease-out; }
  @keyframes slash1 { from { transform: rotate(45deg) scaleX(0); } to { transform: rotate(45deg) scaleX(1); } }
  @keyframes slash2 { from { transform: rotate(-45deg) scaleX(0); } to { transform: rotate(-45deg) scaleX(1); } }
  @keyframes thud { 0% { transform: scale(1.35); } 60% { transform: scale(.92); } 100% { transform: scale(1); } }

  /* active slot */
  /* the ring stays still; only the wider glow on a layer of its own fades in and out (opacity runs on the graphics
     card; an animated box-shadow / filter would repaint every frame on the CPU, OBS included). Themes set the colours. */
  :root { --pulse-lo: 0 0 0 2px var(--gold-hi), 0 0 10px 2px rgba(246,229,181,.5); --pulse-hi: 0 0 24px 7px rgba(246,229,181,.85); --turn-glow: rgba(246,229,181,.95); }
  .pick.active .glow, .ban.active { box-shadow: var(--pulse-lo); }
  .pick.active .glow::after, .ban.active::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: var(--pulse-hi); opacity: 0; animation: glowPulse 1.1s ease-in-out infinite; }
  .pick.active, .ban.active { z-index: 4; }
  @keyframes glowPulse { 50% { opacity: 1; } }
  @keyframes chev   { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
  @keyframes heroIn { 0% { opacity: 0; transform: translateY(30px) scale(1.25); filter: blur(7px) brightness(2.4); } 60% { opacity: 1; filter: blur(0) brightness(1.4); } 100% { opacity: 1; } }
  @keyframes flash  { 0% { opacity: .9; } 100% { opacity: 0; } }
  @keyframes bump   { 0% { transform: scale(.94); } 45% { transform: scale(1.05); } 100% { transform: scale(1); } }
  @keyframes banIn  { 0% { opacity: 0; transform: scale(1.4); filter: brightness(2.5); } 100% { opacity: 1; transform: none; } }

  /* ---------------- center: asset 429 x 341 ---------------- */
  .center { position: absolute; left: 586px; top: 19px; width: 429px; height: 341px; z-index: 5; }
  .center .cbg { position: absolute; left: 0; top: 0; width: 429px; height: 341px; filter: drop-shadow(0 -4px 10px rgba(0,0,0,.35)); }
  .center .spike { position: absolute; left: 153px; top: 238px; width: 123px; height: 103px; z-index: 1; }

  .ctitle { position: absolute; left: 40px; right: 40px; top: 103px; text-align: center; z-index: 3; }
  .stage-title {
    font: 600 27px/1 var(--display); letter-spacing: .005em; text-transform: uppercase; white-space: nowrap;
    background: linear-gradient(180deg, #fffaf0, #f4e6c2 60%, #dcc08a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.55));
  }
  .format { margin-top: 3px; font: 500 15px/1 var(--display); letter-spacing: .03em; color: var(--cream); text-shadow: 0 1px 2px rgba(0,0,0,.6); }

  .logo { position: absolute; top: 173px; width: 86px; height: 88px; z-index: 3; }
  .logo.left  { left: 60px;  --c: var(--left-rgb); }
  .logo.right { left: 283px; --c: var(--right-rgb); }
  .logo .lframe { position: absolute; left: 0; top: 0; width: 86px; height: 88px; z-index: 2; pointer-events: none; }
  .logo .in { position: absolute; left: 11px; top: 9px; width: 64px; height: 56px; z-index: 1; display: grid; place-items: center; padding: 5px; background: #040705; }
  .logo img.lg { position: absolute; left: 5px; top: 5px; width: calc(100% - 10px); height: calc(100% - 10px); object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .logo span { font: 600 19px/1 var(--display); color: var(--cream); letter-spacing: .02em; }
  .logo.turn::before { content: ""; position: absolute; inset: -14px; z-index: 0; pointer-events: none; border-radius: 50%;
    background: radial-gradient(closest-side, var(--turn-glow), transparent); opacity: 0; animation: glowPulse 1.2s ease-in-out infinite; }

  /* FIRST PICK: above the crest, pointing to the team that picks first */
  .fp { position: absolute; left: 50%; top: -22px; z-index: 6; transform: translateX(-50%); display: none; align-items: center; gap: 5px; white-space: nowrap;
    padding: 3px 10px 3px; border-radius: 3px; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #10241a;
    font: 800 9.5px/1.1 var(--font); letter-spacing: .14em; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .fp.on { display: flex; }
  .fp b { font-size: 9px; animation: nudge 1s ease-in-out infinite; }
  .fp.left b.r, .fp.right b.l { display: none; }
  .fp.left b.l { --dx: -3px; } .fp.right b.r { --dx: 3px; }
  @keyframes nudge { 50% { transform: translateX(var(--dx)); } }

  .score { position: absolute; left: 0; right: 0; top: 175px; z-index: 3; display: flex; justify-content: center; align-items: center; gap: 13px; }
  .score b, .score i {
    font: 600 74px/1 var(--display); font-style: normal; display: inline-block; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #ffffff, #f8efd9 55%, #e4cfa0); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.6));
  }
  .score i { font-size: 30px; transform: translateY(2px); }
  .score b.bump { animation: scoreIn .6s cubic-bezier(.16,1,.3,1); }
  body.no-score .score { display: none; }
  @keyframes scoreIn { 0% { transform: scale(1.8); } 100% { transform: scale(1); } }

  .clock { position: absolute; top: 266px; width: 120px; text-align: center; z-index: 3; }
  .clock.left  { left: 43px; }
  .clock.right { left: 266px; }
  .clock .label { font: 700 10.5px/1 var(--font); letter-spacing: .02em; color: var(--cream); }
  .clock .time  { font: 800 23px/1 var(--font); margin-top: 4px; color: #dcc289; font-variant-numeric: tabular-nums; }
  .clock.on .label { color: var(--gold-hi); text-shadow: 0 0 8px rgba(246,229,181,.7); }
  .clock.on .time { color: #fff3d4; }
  .clock.burn .label, .clock.burn .time { color: #ff8a6e; }

  /* ---------------- hero stats popup (step 4) ---------------- */
  .statpop {
    position: absolute; left: var(--popX, 24px); bottom: calc(var(--bar-h) + var(--popY, 132px)); width: 452px; z-index: 6;
    background: linear-gradient(180deg, rgba(27,56,41,.97), rgba(12,26,18,.98)), url(/assets/clouds.jpg) center / 520px auto;
    border: 2px solid var(--gold); border-radius: 8px;
    box-shadow: 0 0 0 1px #0b1a12, inset 0 0 0 4px rgba(12,26,18,.9), inset 0 0 0 5px rgba(210,180,122,.35), 0 14px 30px rgba(0,0,0,.55);
    padding: 14px 18px 14px 22px; opacity: 0; transform: translateX(-40px);
    transition: opacity .35s ease, transform .5s cubic-bezier(.16,1,.3,1);
  }
  .statpop.show { opacity: 1; transform: none; }
  .statpop::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 5px; border-radius: 0 3px 3px 0; background: rgb(var(--pc, 214,189,134)); }
  .statpop .orn { position: absolute; top: -17px; right: 22px; width: 70px; }
  .sp-head { display: flex; align-items: center; gap: 14px; }
  .sp-head img { width: 96px; height: 54px; object-fit: cover; border: 1.5px solid var(--gold); border-radius: 3px; flex: none; }
  .sp-name { font: 600 30px/1 var(--display); text-transform: uppercase; color: var(--cream); letter-spacing: .01em; }
  .sp-sub { margin-top: 5px; font: 800 10.5px/1.2 var(--font); letter-spacing: .14em; color: var(--gold); text-transform: uppercase; }
  .sp-tag { display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 3px; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #10241a; letter-spacing: .1em; }
  .sp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .sp-box { padding: 8px 6px 7px; border-radius: 5px; text-align: center; background: rgba(5,14,9,.55); border: 1px solid rgba(210,180,122,.35); }
  .sp-box b { display: block; font: 700 28px/1 var(--display); color: var(--cream); }
  .sp-box span { display: block; margin-top: 4px; font: 800 9.5px/1 var(--font); letter-spacing: .12em; color: var(--gold); }
  .sp-box small { display: block; margin-top: 3px; font: 600 10px/1 var(--font); color: rgba(246,236,210,.6); }
  .sp-row { display: flex; gap: 16px; margin-top: 10px; font: 700 12px/1.3 var(--font); color: rgba(246,236,210,.75); flex-wrap: wrap; }
  .sp-row b { color: var(--cream); font: 600 17px/1 var(--display); letter-spacing: .02em; margin-left: 5px; }
  .sp-row em { font-style: normal; color: var(--gold); font-weight: 800; letter-spacing: .1em; font-size: 10.5px; }
  .sp-foot { margin-top: 9px; font: 600 11.5px/1.35 var(--font); color: rgba(246,236,210,.8); }
  .sp-foot em { font-style: normal; color: var(--gold); font-weight: 800; letter-spacing: .1em; font-size: 10.5px; margin-right: 6px; }

  .tnm { display: none; }                 /* team names under the logos: used by some tournament designs */
  /* solo preview (control panel framing tool) */
  body.solo .stage { display: none; }
  #solo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(var(--soloScale, 1.4)); }
</style>
</head>
<body>
<div class="stage">
  <div class="wrap hidden" id="wrap">
    <div class="bar16">
      <img class="panel left" src="/assets/bar/panel-left.png" alt="">
      <img class="panel right" src="/assets/bar/panel-right.png" alt="">
      <div class="corner left"><img class="c1" src="/assets/cloud-dark.png" alt=""></div>
      <div class="corner right"><img class="c1" src="/assets/cloud-dark.png" alt=""></div>
      <section class="side left" id="side-left"></section>
      <section class="side right" id="side-right"></section>

      <section class="center">
        <img class="cbg" src="/assets/bar/center.png" alt="">
        <img class="spike" src="/assets/bar/spike.png" alt="">
        <div class="fp" id="fp"><b class="l">&#9664;</b>FIRST PICK<b class="r">&#9654;</b></div>
        <div class="ctitle">
          <div class="stage-title" id="stageTitle"></div>
          <div class="format" id="format">BO 3</div>
        </div>
        <div class="logo left" id="logo-left"><div class="in"></div><img class="lframe" src="/assets/bar/logo-frame-left.png" alt=""></div>
        <div class="score"><b id="score-left">0</b><i>:</i><b id="score-right">0</b></div>
        <div class="logo right" id="logo-right"><div class="in"></div><img class="lframe" src="/assets/bar/logo-frame-right.png" alt=""></div>
        <div class="tnm left" id="tnm-left"></div><div class="tnm right" id="tnm-right"></div>
        <div class="clock left" id="clock-left"><div class="label">RESERVE</div><div class="time">0:00</div></div>
        <div class="clock right" id="clock-right"><div class="label">RESERVE</div><div class="time">0:00</div></div>
      </section>
    </div>

    <div class="statpop" id="statpop"></div>
  </div>
</div>

<script src="/sfx.js"></script>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const DEMO = qs.has('demo');
  if (qs.has('bg') || (DEMO && !qs.has('nobg'))) document.body.classList.add('preview');

  const SIDES = ['left', 'right'];
  const CARD_W = 100, CARD_H = 134;           // artwork window of the pick frame
  let heroes = new Map();
  let custom = {};
  let S = null;
  let offset = 0;
  let firstRender = true;
  let lastVisible = null, lastActive = null;
  const slots = { left: { bans: [], picks: [] }, right: { bans: [], picks: [] } };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; };
  const hexToRgb = (hex) => {
    const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec((hex || '').trim());
    if (!m) return null;
    let h = m[1]; if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
  };

  const CHEV = '<svg class="chev" viewBox="0 0 64 26"><path d="M4 4 L32 22 L60 4" fill="none" stroke="#f6e5b5" stroke-width="7"/></svg>';

  // ---- waist-up framing: find the hero's body in Valve's render and crop around it ----
  const frames = new Map();
  function heroBox(slug) {
    if (frames.has(slug)) return frames.get(slug);
    const p = new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        try {
          const k = Math.min(1, 260 / img.naturalWidth);
          const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          const g = cv.getContext('2d', { willReadFrequently: true });
          g.drawImage(img, 0, 0, w, h);
          const d = g.getImageData(0, 0, w, h).data;
          let x0 = w, y0 = h, x1 = -1, y1 = -1;
          for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
            if (d[(y * w + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
          }
          if (x1 < 0 || (x0 === 0 && y0 === 0 && x1 === w - 1 && y1 === h - 1)) return resolve(null);
          const bw = x1 - x0 + 1;
          const col = new Float32Array(bw);
          for (let x = x0; x <= x1; x++) { let c = 0; for (let y = y0; y <= y1; y++) if (d[(y * w + x) * 4 + 3] > 40) c++; col[x - x0] = c; }
          const r = Math.max(2, Math.round(bw * 0.06));
          const sm = new Float32Array(bw);
          for (let i = 0; i < bw; i++) { let t = 0, n = 0; for (let j = i - r; j <= i + r; j++) if (j >= 0 && j < bw) { t += col[j]; n++; } sm[i] = t / n; }
          let pk = 0; for (let i = 1; i < bw; i++) if (sm[i] > sm[pk]) pk = i;
          let bl = pk, br = pk;
          while (bl > 0 && sm[bl - 1] >= sm[pk] * 0.45) bl--;
          while (br < bw - 1 && sm[br + 1] >= sm[pk] * 0.45) br++;
          let ws = 0, wx = 0;
          for (let i = bl; i <= br; i++) { const wt = sm[i] ** 3; ws += wt; wx += wt * (i + 0.5); }
          const bodyCx = ws ? wx / ws : (bl + br + 1) / 2;
          let by0 = y1;
          for (let y = y0; y <= y1 && by0 === y1; y++) for (let x = x0 + bl; x <= x0 + br; x++) if (d[(y * w + x) * 4 + 3] > 40) { by0 = y; break; }
          resolve({ iw: img.naturalWidth, ih: img.naturalHeight, x: x0 / k, w: bw / k, y: by0 / k, h: (y1 - by0 + 1) / k, cx: (x0 + bodyCx) / k, bodyW: (br - bl + 1) / k });
        } catch { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = '/img/render/' + slug;
    });
    frames.set(slug, p);
    return p;
  }
  function placeFramed(node, slug, box) {
    const d = S?.display || {};
    const o = (d.heroFraming || {})[slug] || {};
    const waist = Number(o.waist ?? d.portraitWaist ?? 0.58);
    const top = Number(o.top ?? d.portraitTop ?? 0.06);
    const minW = Number(o.minWidth ?? d.portraitMinWidth ?? 0.7);
    const A = CARD_W / CARD_H;
    let ch = (box.h * waist) / (1 - top);
    let cw = ch * A;
    const bodyW = Number.isFinite(box.bodyW) ? box.bodyW : box.w;
    if (cw < bodyW * minW) { cw = bodyW * minW; ch = cw / A; }
    if (ch > box.h * 1.08) { ch = box.h * 1.08; cw = ch * A; }
    const zoom = Math.min(3, Math.max(0.5, Number(o.zoom) || 1));
    ch /= zoom; cw /= zoom;
    const centre = Number.isFinite(box.cx) ? box.cx : box.x + box.w / 2;
    const cx = centre - cw / 2 + (Number(o.x) || 0) * cw;
    const cy = box.y - ch * top + (Number(o.y) || 0) * ch;
    const s = CARD_W / cw;
    node.classList.add('framed');
    node._slug = slug; node._box = box;
    Object.assign(node.style, { width: box.iw * s + 'px', height: box.ih * s + 'px', left: -cx * s + 'px', top: -cy * s + 'px' });
  }

  function iconImg(h) { const i = new Image(); i.className = 'icon'; i.onerror = () => i.remove(); i.src = '/img/icon/' + h.slug; return i; }
  function heroMedia(h) {
    const c = custom[h.slug];

      m.className = 'full'; m.src = '/heroes/' + c.file;

    } else {

      m.src = '/heroes-anim/' + h.slug + '.webm';

      m.addEventListener('error', () => { m.addEventListener('error', still, { once: true }); m.src = '/img/anim/' + h.slug; m.play?.().catch(() => {}); }, { once: true });

    heroBox(h.slug).then((b) => { if (b) placeFramed(m, h.slug, b); });

  function setSlot(node, type, id, animate, side) {

  function popupHtml(h, side, type) {

  const fmt = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function tick() {

    const t = S.timer;
    let main = t.running ? (t.endsAt - now) / 1000 : t.remaining;
    const over = Math.max(0, -main);
    main = Math.max(0, main);
    for (const side of SIDES) {
      const c = $('clock-' + side);

        else { burn = true; time = S.mode === 'gsi' ? S.reserve[side] : S.reserve[side] - over; }
      }

      // only when it changes: rewriting the same text 10x a second still re-lays out and repaints the clock

  function apply(state) {
    SFX.config(state.sfx, true);
    S = state; offset = (state.serverNow || Date.now()) - Date.now();
    if (state.statsVersion !== statsVersion) { statsVersion = state.statsVersion; loadStats(); }
    const pt = state.popupTest;
    if (pt && pt.at !== lastTestAt) {
      const fresh = Date.now() + offset - pt.at < 8000;
      lastTestAt = pt.at;
      if (fresh && !SOLO) setTimeout(() => { const h = heroes.get(pt.heroId); if (h) { popQueue.push({ h, side: pt.side || 'left', type: 'pick' }); if (!popBusy) nextPopup(); } }, 50);
    }
    if (SOLO) return renderSolo();
    render();
  }

  function demo() {
    const list = 'antimage:Anti-Mage|axe:Axe|pudge:Pudge|lina:Lina|invoker:Invoker|mars:Mars|tiny:Tiny|lion:Lion|rubick:Rubick|sven:Sven|ursa:Ursa|kez:Kez|muerta:Muerta|tusk:Tusk|mirana:Mirana|enigma:Enigma|razor:Razor|puck:Puck|viper:Viper|luna:Luna|slark:Slark|medusa:Medusa|jakiro:Jakiro|chen:Chen'
      .split('|').map((r, i) => { const [slug, name] = r.split(':'); return { id: i + 1, slug, name }; });
    heroes = new Map(list.map((h) => [h.id, h]));
    firstRender = false;
    apply({
      mode: 'manual', visible: true, serverNow: Date.now(), firstPick: 'right', statsVersion: 0,
      event: { title: 'DIRE BATTLE CUP', stage: 'GRAND FINALS', format: 'BO3', logo: '' },
      teams: { left: { name: 'MAXWELL+4', tag: 'MXW', color: '#d8323c', logo: '', score: 1, players: ['kaisora', 'Maxwell', 'Alvyy', 'Vy-', 'icysnow'], captain: 3 },
               right: { name: 'ESCAPE ESPORTS', tag: 'ESC', color: '#3fc3d6', logo: '', score: 0, players: ['ndnc', 'Atréyu', 'serenity', 'Boy pablo-', 'Nerif'], captain: 4 } },
      slots: { left: { bans: [1, 2, 3, 4, 5, 6, 7], picks: [15, 16, 17, 18, null] }, right: { bans: [8, 9, 10, 11, 12, 13, 14], picks: [19, 20, 21, 22, 23] } },
      pickPlayers: { left: [0, 1, 2, 3, null], right: [0, 1, 2, 3, 4] },
      active: { side: 'left', type: 'pick', index: 4 },
      timer: { running: true, endsAt: Date.now() + 25000, remaining: 25 },
      reserve: { left: 130, right: 130 },
      display: { animatedPortraits: false },
    });
  }
  if (DEMO) return demo();

  const loadCustom = () => fetch('/api/custom-media').then((r) => r.json()).then((m) => { custom = m || {}; }).catch(() => {});
  setInterval(loadCustom, 30000);
  setInterval(loadSounds, 30000);
  Promise.all([loadCustom(), loadSounds()]).then(() => fetch('/api/heroes')).then((r) => r.json()).then((list) => {
    heroes = new Map(list.map((h) => [h.id, h]));
    const es = new EventSource('/events');
    es.onmessage = (e) => { try { apply(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  }).catch(() => setTimeout(() => location.reload(), 3000));
})();
</script>
