<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/vendor/anime.umd.min.js"></script><script src="/ui/motion.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Direborn Broadcast</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a1a12; --gold: #d6bd86; --gold-hi: #f3e4b8; --text: #f4e8c6; --muted: #b3bea9; --bad: #f6b1a4; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; color: var(--text); font: 600 14px Montserrat, "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, rgba(10,26,18,.86), rgba(10,26,18,.96)), url(/assets/clouds.jpg) center / cover, var(--bg); }
  form { width: min(380px, 100%); display: grid; gap: 14px; padding: 26px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
  h1 { margin: 0; font-size: 16px; letter-spacing: 0; color: var(--gold-hi); }
  p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  input { font: inherit; padding: 11px 12px; border-radius: 9px; border: 1px solid rgba(214,189,134,.45); background: #06120c; color: var(--text); }
  input:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  button { font: inherit; font-weight: 600; padding: 12px; border-radius: 10px; border: 1px solid var(--gold-hi); background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #10291c; cursor: pointer; letter-spacing: 0; }
  .err { color: var(--bad); }
</style>
<link rel="stylesheet" href="/ui/panel.css">
</head>
<body class="db-panel">
<form method="post" action="/login">
  <h1>Direborn Broadcast</h1>
  <p>Masuk sebagai operator untuk membuka control panel. Overlay OBS tidak perlu login.</p>
  <p class="err" id="err" hidden></p>
  <label>Password operator<input type="password" name="password" autocomplete="current-password" required autofocus></label>
  <input type="hidden" name="next" id="next">
  <button type="submit" class="primary">Masuk</button>
</form>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('next').value = q.get('next') || '/control';
  const e = q.get('e');
  if (e) { const el = document.getElementById('err'); el.hidden = false; el.textContent = e === 'setup' ? 'Secret ADMIN_PASSWORD belum diisi di Cloudflare.' : 'Password salah.'; }
</script>
</body>
</html>
