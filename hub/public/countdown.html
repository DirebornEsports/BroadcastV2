<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/vendor/anime.umd.min.js"></script><script src="/ui/motion.js"></script><script src="/theme.js"></script>
<title>Countdown</title>
<!-- OBS: Browser source 1920 x 1080 over the "starting soon" scene. Bottom right: time left until live (set in Draft control
     -> On air -> Countdown live). Bottom middle: the next match from the bracket (same data as /nextmatch). -->
<style>
  @font-face { font-family: "Teko"; src: url(/fonts/Teko.woff) format("woff"); font-weight: 300 700; font-display: block; }
  @font-face { font-family: "Oswald"; src: url(/fonts/Oswald.woff) format("woff"); font-weight: 200 700; font-display: block; }
  :root { --gold: #f3dc9e; --gold-lab: #e9c87e; --jade: #3fd0bd; --cream: #f5efdc; --ease: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.bg { background: #0b4a46; }
  #fit { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(var(--k, 1)); }
  .blk { position: absolute; opacity: 0; clip-path: inset(50% 0 50% 0); transition: opacity .25s ease, clip-path .6s var(--ease); }
  .blk.in { opacity: 1; clip-path: inset(-20% -20% -20% -20%); }

  /* bottom middle (above the social links): the next match */
  .vs { left: 706px; top: 826px; width: 1260px; margin-left: -630px; text-align: center; }
  .vs .kick { font: 500 18px/1 "Oswald", sans-serif; letter-spacing: .24em; text-transform: uppercase; color: var(--jade); }
  .vs .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 30px; margin-top: 14px; }
  .team { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .team.a { justify-content: flex-end; }
  .team .nm { min-width: 0; max-width: 430px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 58px/1 "Teko", sans-serif; letter-spacing: .01em; color: var(--cream); text-shadow: 0 3px 14px rgba(0,0,0,.45); padding-top: 6px; }
  .team .lg { flex: none; width: 92px; height: 92px; display: grid; place-items: center; }
  .team .lg img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  .team .lg span { font: 600 30px/1 "Oswald", sans-serif; color: var(--gold); }
  .vs .v { font: 600 64px/1 "Teko", sans-serif; color: var(--gold); text-shadow: 0 3px 14px rgba(0,0,0,.4); padding-top: 6px; }

  /* bottom right box of the scene: time left until live */
  .cd { left: 1415px; top: 811px; width: 505px; height: 269px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cd .lab { font: 500 24px/1 "Oswald", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-lab); }
  .cd .t { margin-top: 10px; font: 600 156px/.8 "Teko", sans-serif; font-variant-numeric: tabular-nums; color: var(--gold); text-shadow: 0 4px 18px rgba(0,0,0,.45); padding-top: 12px; }
  .cd.long .t { font-size: 124px; }
  .cd.done .lab { color: var(--jade); }
  .cd.done .t { font-size: 96px; letter-spacing: .01em; }
</style>
</head>
<body>
<div id="fit">
  <section class="blk vs" id="vs">
    <div class="kick" id="kick">Next match</div>
    <div class="row">
      <div class="team a"><span class="nm" id="nmA"></span><span class="lg" id="lgA"></span></div>
      <div class="v">VS</div>
      <div class="team b"><span class="lg" id="lgB"></span><span class="nm" id="nmB"></span></div>
    </div>
  </section>
  <section class="blk cd" id="cd"><div class="lab" id="lab">Live dalam</div><div class="t" id="t">00:00</div></section>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id), fit = $('fit');
  if (new URLSearchParams(location.search).get('bg') === '1') document.body.classList.add('bg');
  const resize = () => fit.style.setProperty('--k', Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener('resize', resize); resize();
  let C = null, offset = 0;
  const pad = (n) => String(n).padStart(2, '0');
  function fmt(ms) {
    const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`;
  }
  function tick() {
    const box = $('cd');
    if (!C || C.visible === false || !C.endsAt) { box.classList.remove('in'); return; }
    const left = C.endsAt - (Date.now() + offset), done = left <= 0;
    box.classList.toggle('done', done); box.classList.toggle('long', !done && left >= 3600000);
    $('lab').textContent = done ? 'Sebentar lagi' : (C.label || 'Live dalam');
    $('t').textContent = done ? 'Segera live' : fmt(left);
    box.classList.add('in');
  }
  setInterval(tick, 250);

  function logo(el, t) {
    el.textContent = '';
    if (t.logo) { const img = new Image(); img.alt = ''; img.src = t.logo; img.onerror = () => { el.textContent = ''; const s = document.createElement('span'); s.textContent = t.tag || ''; el.appendChild(s); }; el.appendChild(img); }
    else if (t.tag) { const s = document.createElement('span'); s.textContent = t.tag; el.appendChild(s); }
  }
  async function loadNext() {
    try {
      const D = await (await fetch('/api/nextmatch', { cache: 'no-store' })).json(), vs = $('vs');
      if (D.none || !D.a || (C && C.visible === false)) { vs.classList.remove('in'); return; }
      $('kick').textContent = ['Next match', D.round, D.bo ? 'BO' + D.bo : ''].filter(Boolean).join(' · ');
      $('nmA').textContent = D.a.name; $('nmB').textContent = D.b.name;
      logo($('lgA'), D.a); logo($('lgB'), D.b);
      vs.classList.add('in');
    } catch {}
  }
  loadNext(); setInterval(loadNext, 20000);
  let sig = null;
  function connect() {
    const es = new EventSource('/events');
    es.onmessage = (e) => {
      const S = JSON.parse(e.data);
      offset = (S.serverNow || Date.now()) - Date.now();
      C = S.countdown || null; tick();
      const s2 = JSON.stringify(S.nextMatch) + '|' + S.statsVersion + '|' + (C && C.visible);   // bracket saved, settings changed or shown/hidden
      if (s2 !== sig) { sig = s2; loadNext(); }
    };
    es.onerror = () => { es.close(); setTimeout(connect, 2000); };
  }
  connect();
})();
</script>
</body>
</html>
