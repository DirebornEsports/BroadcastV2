<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cam debug</title>
<style>
  body { margin: 0; padding: 24px; background: #0a1a12; color: #f4e8c6; font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  button { font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 7px; border: 1px solid #d6bd86; background: #d6bd86; color: #10291c; cursor: pointer; }
  pre { white-space: pre-wrap; word-break: break-all; background: #06120c; border: 1px solid rgba(214,189,134,.3); border-radius: 8px; padding: 12px; font-size: 12px; }
</style>
</head>
<body>
<h2>Cam debug — tes koneksi ke Cloudflare Realtime</h2>
<p>Tidak butuh webcam (pakai gambar buatan). Tekan tombol, lalu screenshot / copy semua teks hasilnya ke tim teknis.</p>
<button id="go">Jalankan tes</button>
<pre id="out">—</pre>
<script src="/camrtc.js"></script>
<script>
document.getElementById('go').onclick = async () => {
  const out = document.getElementById('out'); out.textContent = 'Menjalankan…';
  try {
    const keys = await fetch('/api/cam/admin', { cache: 'no-store' }).then((r) => r.json());
    if (!keys.ok) throw new Error('Login operator dulu (' + (keys.error || '') + ')');
    const cv = document.createElement('canvas'); cv.width = 640; cv.height = 360;
    const g = cv.getContext('2d'); setInterval(() => { g.fillStyle = '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'); g.fillRect(0, 0, 640, 360); }, 100);
    const track = cv.captureStream(30).getVideoTracks()[0];
    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }], bundlePolicy: 'max-bundle' });
    const tr = pc.addTransceiver(track, { direction: 'sendonly' });
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise((r) => { if (pc.iceGatheringState === 'complete') return r(); const t = setTimeout(r, 2000); pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); r(); } }; });
    // second offer: video + an audio tone, like /kirim with a mic
    const ac = new AudioContext(); const osc = ac.createOscillator(); const dst = ac.createMediaStreamDestination(); osc.connect(dst); osc.start();
    const pc2 = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }], bundlePolicy: 'max-bundle' });
    const v2 = pc2.addTransceiver(cv.captureStream(30).getVideoTracks()[0], { direction: 'sendonly' });
    const a2 = pc2.addTransceiver(dst.stream.getAudioTracks()[0], { direction: 'sendonly' });
    await pc2.setLocalDescription(await pc2.createOffer());
    await new Promise((r) => { if (pc2.iceGatheringState === 'complete') return r(); const t = setTimeout(r, 2000); pc2.onicegatheringstatechange = () => { if (pc2.iceGatheringState === 'complete') { clearTimeout(t); r(); } }; });
    const r = await fetch('/api/cam/selftest', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: keys.pushKey, sdp: pc.localDescription.sdp, mid: tr.mid, sdp2: pc2.localDescription.sdp, mid2: v2.mid, micMid2: a2.mid }) }).then((x) => x.json());
    pc2.close(); ac.close();
    out.textContent = JSON.stringify({ browser: navigator.userAgent, mid: tr.mid, ...r }, null, 2);
    pc.close();
  } catch (e) { out.textContent = 'ERROR: ' + e.message; }
};
</script>
</body>
</html>
