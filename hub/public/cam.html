<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/vendor/anime.umd.min.js"></script><script src="/ui/motion.js"></script>
<script src="/theme.js"></script>
<title>Player Cam</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #e9c679; --gold-hi: #f8e6ad; --text: #f3eee2; --teal: #5fd4a4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: Poppins, "Segoe UI", sans-serif; }
  body.bg { background: #222 url(/assets/clouds.jpg) center / cover; }
  #fit { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(var(--k, 1)); }
  /* frameless, in the shape of the old frame (no border art): the picture is cut to the frame's body, the name sits on
     the slanted tab above it. The whole shape opens from a thin band at its middle (expo ease-out, no bounce) */
  .box { position: absolute; left: var(--x); top: var(--y); width: var(--w); height: var(--h); opacity: 0; filter: drop-shadow(0 10px 22px rgba(0,0,0,.45)); transition: opacity .2s ease; }
  .box.in { opacity: 1; }
  .shape { position: absolute; inset: 0; clip-path: inset(50% 0 50% 0); transition: clip-path .55s cubic-bezier(.16,1,.3,1); }
  .box.in .shape { clip-path: inset(0 0 0 0); }
  /* body outline traced from the old cam-mask.png (254 x 209) */
  .frame { position: absolute; inset: 0; background: #0b0f12; clip-path: polygon(5% 25.8%, 97.9% 25.8%, 97.4% 40.4%, 92.5% 40.4%, 92.5% 46%, 87.7% 46%, 84% 75%, 80.7% 98%, 7.5% 98%, 2.6% 47.8%); }
  .frame canvas, .frame .sil { position: absolute; left: 0; top: 25.8%; width: 100%; height: 72.2%; object-fit: cover; opacity: 0; transition: opacity .28s ease; }
  .frame canvas.on, .frame .sil.on { opacity: 1; }
  /* name tab: solid, slanted left edge, flush on the body */
  .plate { position: absolute; left: 33.5%; right: 2.1%; top: 7%; height: 18.8%; display: flex; align-items: center; justify-content: flex-end; gap: calc(6px * var(--s, 1)); padding: 0 calc(10px * var(--s, 1)) 0 18%; background: rgba(11,15,18,.94); clip-path: polygon(16.3% 0, 100% 0, 100% 100%, 0 100%); overflow: hidden; }
  .plate .nm { color: #fff; font: 700 calc(15px * var(--s, 1))/1 Poppins, "Segoe UI", sans-serif; white-space: nowrap; }
  .plate .tg { color: rgba(255,255,255,.62); font: 600 calc(11px * var(--s, 1))/1 Poppins, "Segoe UI", sans-serif; white-space: nowrap; }
  .plate .tg:empty { display: none; }
  .plate.swap .nm, .plate.swap .tg { animation: plateIn .45s cubic-bezier(.16,1,.3,1) both; }
  .plate.swap .tg { animation-delay: .06s; }
  @keyframes plateIn { from { opacity: 0; transform: translateX(8px); } }
  .noname .plate { display: none; }
  #dbg { position: absolute; left: 10px; top: 10px; padding: 8px 10px; background: rgba(0,0,0,.7); color: #cfe; font: 12px/1.5 monospace; white-space: pre; display: none; }
  .debug #dbg { display: block; }
</style>
</head>
<body>
<div id="fit">
  <div class="box" id="box"><div class="shape"><div class="frame" id="frame"><img class="sil" id="sil" src="/assets/cam-silhouette.svg" alt=""></div><div class="plate" id="plate"><span class="nm" id="nm"></span><span class="tg" id="tg"></span></div></div></div>
  <div id="dbg"></div>
</div>
<script src="/camrtc.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('bg') === '1') document.body.classList.add('bg');
  if (q.get('debug') === '1') document.body.classList.add('debug');
  const fit = document.getElementById('fit'), box = document.getElementById('box'), frame = document.getElementById('frame');
  const resize = () => fit.style.setProperty('--k', Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener('resize', resize); resize();
  const normName = (s) => String(s || '').toLowerCase().replace(/\s+/g, '');
  const stripTag = (s) => normName(s).replace(/^[^.]*\./, '');
  const sameName = (a, b) => !!a && !!b && (normName(a) === normName(b) || stripTag(a) === stripTag(b));

  // the view key comes in the OBS URL: /cam?k=<VIEW_KEY> (copy it from the Player cam panel)
  const KEY = q.get('k') || '', BASE = location.origin;
  let S = null, C = null, cfgSig = '', ice = null, pollTimer = null, lastError = KEY ? '' : 'URL overlay belum ada kunci lihat (?k=…). Copy URL dari panel Player cam.';
  const cams = new Map();                  // lower-case name -> { name, dc, conn, since, state, canvas, online, connecting }
  if (q.get('debug') === '1') window.__cams = cams;
  let current = null, shownAt = 0, shownName = '';

  // ---------- mic audio: every player's mic, delayed like the video, mixed into this source ----------
  // (OBS: tick "Control audio via OBS" on this Browser source to get it in the mixer)
  let actx = null, master = null, skew = 0;
  function audioCtx() {
    if (!actx) { actx = new AudioContext({ latencyHint: 'playback' }); master = actx.createGain(); master.connect(actx.destination); }
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    return actx;
  }
  addEventListener('pointerdown', () => { if (actx) actx.resume().catch(() => {}); });
  // how much history to keep: the delay, plus everything since a "horn LIVE" mark (so the sync can jump straight to it)
  function retainMs() {
    const d = (Number(C && C.delay) || 0) * 1000;
    // a mark older than the 17 min sync window can no longer be used: stop holding history for it
    const age = C && C.syncAt ? Date.now() + skew - C.syncAt : 0;
    const mark = age && age < 1040000 ? age + 20000 : 0;
    return Math.max(d + 20000, mark);
  }
  function audioGain(c) {
    if (!c.au || !C) return;
    const m = (C.mics || {})[c.name.toLowerCase()] || {};
    const v = C.audio === false || m.muted ? 0 : (m.vol ?? 1);
    c.au.gain.gain.setTargetAtTime(v, actx.currentTime, 0.03);
  }
  function attachAudio(c, track) {
    const ctx = audioCtx();
    if (!c.au) {
      const pre = ctx.createGain(), an = ctx.createAnalyser(), gain = ctx.createGain();
      an.fftSize = 4096; gain.gain.value = 0;
      pre.connect(an); pre.connect(gain); gain.connect(master);
      c.au = { pre, an, gain, da: new DBCam.DelayAudio(ctx, pre), peak: 0, buf: new Float32Array(4096), el: new Audio() };
      c.au.el.muted = true;
    }
    try { c.au.el.srcObject = new MediaStream([track]); c.au.el.play().catch(() => {}); } catch {}
    audioGain(c);
  }
  function dropAudio(c) {
    const a = c.au; if (!a) return;
    try { a.da.clear(); a.pre.disconnect(); a.gain.disconnect(); a.el.srcObject = null; } catch {}
    c.au = null;
  }
  function audioTick() {
    if (!actx || !C) return;
    master.gain.setTargetAtTime(Number(C.master ?? 1), actx.currentTime, 0.03);
    for (const c of cams.values()) {
      if (!c.au) continue;
      audioGain(c);
      c.au.an.getFloatTimeDomainData(c.au.buf);
      let sum = 0; for (let i = 0; i < c.au.buf.length; i++) sum += c.au.buf[i] * c.au.buf[i];
      const db = 20 * Math.log10(Math.sqrt(sum / c.au.buf.length) + 1e-9);
      c.au.peak = Math.max(c.au.peak, Math.max(0, Math.min(1, (db + 60) / 60)));
    }
  }
  setInterval(audioTick, 100);
  function tickAll() {
    if (!C) return;
    const d = (Number(C.delay) || 0) * 1000, keep = retainMs();
    for (const c of cams.values()) { c.dc.tick(d, keep, c === current); if (c.au) c.au.da.tick(d, keep); }
  }

  function camFor(name) { for (const c of cams.values()) if (sameName(c.name, name)) return c; return null; }
  function ensureCam(name) {
    const k = name.toLowerCase();
    let c = cams.get(k);
    if (!c) {
      const canvas = document.createElement('canvas'); canvas.width = 16; canvas.height = 9;
      frame.appendChild(canvas);
      c = { name, dc: new DBCam.DelayCam(canvas), conn: null, since: 0, state: 'new', canvas, online: false, connecting: false, err: '' };
      cams.set(k, c);
    }
    return c;
  }
  // "Reset buffer" from the control panel: drop everything stored, start collecting again
  let resetSeq = null;
  function checkReset() {
    const r = C.reset || { seq: 0, name: '' };
    if (resetSeq !== null && r.seq !== resetSeq) {
      for (const c of cams.values()) {
        if (r.name && !sameName(c.name, r.name)) continue;
        c.dc.clear(); if (c.au) c.au.da.clear();
        if (c === current) { c.canvas.classList.remove('on'); hide(); }
      }
    }
    resetSeq = r.seq;
  }
  // cameras the panel set as a team cam (Team cam card) belong to the /teamcam source
  function isTeamCam(name) { const t = C && C.teamCam; return !!t && [t.left, t.right].some((n) => n && n.toLowerCase() === String(name).toLowerCase()); }
  function dropCam(name) {
    const k = String(name).toLowerCase(), c = cams.get(k); if (!c) return;
    try { c.conn && c.conn.close(); } catch {} dropAudio(c); c.dc.clear(); c.canvas.remove(); cams.delete(k);
    if (current === c) hide();
  }
  function closeAll() {
    for (const c of cams.values()) { try { c.conn && c.conn.close(); } catch {} dropAudio(c); c.dc.clear(); c.canvas.remove(); }
    cams.clear(); current = null; box.classList.remove('in');
  }
  async function connect(c) {
    if (c.connecting) return;
    c.connecting = true; c.err = '';
    try { c.conn && c.conn.close(); } catch {}
    c.dc.newSource();
    try {
      c.conn = await DBCam.pull({ base: BASE, key: KEY, name: c.name, iceServers: ice, onFrame: (f) => c.dc.push(f), onAudio: (t) => attachAudio(c, t), onAudioFrame: (f) => { if (c.au) c.au.da.push(f); }, onState: (s) => { c.state = s; } });
      c.dc.watch(c.conn.pc);
      c.mic = !!c.conn.mic;
      c.state = c.conn.pc.connectionState;
    } catch (e) { c.err = e.message; c.state = 'error'; c.since = 0; }
    c.connecting = false;
  }
  async function poll() {
    if (!C || !KEY) return;
    try {
      if (!ice) ice = await DBCam.getIce(BASE, KEY);
      const d = await DBCam.api(BASE, '/api/cam/cams', { key: KEY });
      lastError = '';
      const seen = new Set();
      for (const cam of d.cams) {
        if (isTeamCam(cam.name)) { dropCam(cam.name); continue; }       // a team camera goes to /teamcam, not here
        const c = ensureCam(cam.name); seen.add(cam.name.toLowerCase());
        c.online = cam.online;
        if (!cam.online) continue;
        const dead = !c.conn || ['failed', 'closed', 'disconnected', 'error'].includes(c.state);
        if (c.since !== cam.since || dead) { c.since = cam.since; connect(c); }
      }
      for (const [k, c] of cams) if (!seen.has(k)) c.online = false;     // keep its buffer playing out
    } catch (e) { lastError = e.message; }
  }
  function applyConfig() {
    const sig = KEY;
    if (sig !== cfgSig) {
      cfgSig = sig; ice = null; closeAll();
      clearInterval(pollTimer);
      if (KEY) { poll(); pollTimer = setInterval(poll, 4000); }
    }
    const w = C.w || 254;
    fit.style.setProperty('--x', (C.x ?? 293) + 'px'); fit.style.setProperty('--y', (C.y ?? 871) + 'px');
    fit.style.setProperty('--w', w + 'px'); fit.style.setProperty('--h', Math.round(w * 209 / 254) + 'px');    // the old frame's proportions
    fit.style.setProperty('--s', (w / 254).toFixed(3));                        // name grows/shrinks with the picture
    document.body.classList.toggle('noname', C.showName === false);
  }

  let curLabel = '', curTag = '';
  const SIL = { name: '', sil: true };                 // a player without a cam: silhouette picture with their name
  function show(c, label, tag) {
    if (c !== current) {
      for (const x of cams.values()) x.canvas.classList.toggle('on', x === c);
      document.getElementById('sil').classList.toggle('on', c === SIL);
      current = c; shownAt = performance.now();
    }
    if (shownName !== label + '|' + tag) {
      shownName = label + '|' + tag; curLabel = label; curTag = tag;
      document.getElementById('nm').textContent = label; document.getElementById('tg').textContent = tag || '';
      document.getElementById('nm').style.fontSize = label.length > 12 ? `calc(${Math.max(10, Math.round(15 * 12 / label.length))}px * var(--s, 1))` : '';
      const pl = document.getElementById('plate'); pl.classList.remove('swap'); void pl.offsetWidth; pl.classList.add('swap');
    }
    box.classList.add('in');
  }
  function hide() { if (!current && !box.classList.contains('in')) return; box.classList.remove('in'); current = null; shownName = ''; document.getElementById('sil').classList.remove('on'); }

  function frameLoop() {
    if (C) {
      const delayMs = (Number(C.delay) || 0) * 1000;
      tickAll();
      const active = C.visible && C.mode !== 'off';
      const sel = active && S ? S.camSel : null;
      const ready = (c) => c === SIL || (!!c && !!c.dc.status(delayMs).showing);
      let want = null, label = '', tag = '';
      if (sel) {
        want = camFor(sel.name) || camFor(sel.gsiName);
        if (!ready(want)) want = null; else { label = sel.name || want.name; tag = sel.tag || ''; }
      }
      if (!want && sel && C.noCam === 'silhouette') { want = SIL; label = sel.name || sel.gsiName || ''; tag = sel.tag || ''; }
      if (!want && active && C.noCam === 'keep' && ready(current) && current !== SIL) { want = current; label = curLabel; tag = curTag; }
      const held = ready(current) && performance.now() - shownAt < (Number(C.minHold) || 0) * 1000;
      if (want && want === current) show(want, label, tag);
      else if (!held) { if (want) show(want, label, tag); else hide(); }
    }
    requestAnimationFrame(frameLoop);
  }
  requestAnimationFrame(frameLoop);
  // OBS can throttle animation frames for hidden sources: keep decoding anyway
  setInterval(tickAll, 100);

  // report to the control panel
  setInterval(() => {
    if (!C) return;
    const delayMs = (Number(C.delay) || 0) * 1000;
    const list = [...cams.values()].map((c) => { const st = c.dc.status(delayMs); return { name: c.name, online: c.online, state: c.state, err: c.err, codec: st.codec, decErr: st.decErr, h264Broken: st.h264Broken, filled: Math.round(st.filled * 100), receiving: !!st.receiving, showing: !!st.showing, width: st.width, height: st.height, buffered: Math.round(st.buffered), lag: st.showing ? st.lag : null,
      mic: !!(c.au && c.mic), level: c.au ? Math.round(c.au.peak * 100) / 100 : 0, audio: actx ? actx.state : '', audioErr: c.au && c.au.da.err ? c.au.da.err : '', keys: st.keys, seeks: st.seeks, keyAgo: st.keyAgo, age: c.dc.firstAt ? Math.round((performance.now() - c.dc.firstAt) / 1000) : 0 }; });
    for (const c of cams.values()) if (c.au) c.au.peak = 0;
    if (document.body.classList.contains('debug')) document.getElementById('dbg').textContent = (lastError ? 'ERROR ' + lastError + '\n' : '') + list.map((c) => `${c.name.padEnd(12)} ${c.online ? 'on ' : 'off'} ${String(c.state).padEnd(12)} buf ${c.filled}% ${c.showing ? 'SHOW' : ''} ${c.width}x${c.height} lag ${c.lag} mic ${c.mic ? c.level : '-'} ${c.err}`).join('\n');
    fetch('/api/playercam/status?k=' + encodeURIComponent(KEY), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ cams: list, error: lastError, showing: current ? (current === SIL ? '' : current.name) : '', silhouette: current === SIL ? curLabel : '', h264: !list.some((x) => x.h264Broken), up: Math.round(performance.now() / 1000) }) }).catch(() => {});
  }, 2000);

  function connectSse() {
    const es = new EventSource('/events');
    es.onmessage = (e) => { S = JSON.parse(e.data); if (S.serverNow) skew = S.serverNow - Date.now(); C = S.playerCam; if (C) { applyConfig(); checkReset(); } };
    es.onerror = () => { es.close(); setTimeout(connectSse, 2000); };
  }
  connectSse();
})();
</script>
</body>
</html>
