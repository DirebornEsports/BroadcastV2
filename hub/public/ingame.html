<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/vendor/anime.umd.min.js"></script><script src="/ui/motion.js"></script>
<script src="/theme.js"></script>
<title>In-game Player Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --c-rgb: 214, 189, 134;
    --green-900: #0a1d13; --green-800: #10291c; --green-600: #1f5236;
    --gold: #d6bd86; --gold-hi: #f3e4b8; --cream: #f4e8c6;
    --font: "Montserrat", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color: var(--cream); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body.preview { background: radial-gradient(1200px 700px at 40% 40%, #3b4a3a, #151b16); }
  /* 1920x1080 canvas scaled to the source size */
  .canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(var(--fit, 1)); }

  /* ---------- lower third ---------- */
  .lt {
    position: absolute; left: var(--x, 300px); bottom: var(--y, 8px);
    width: 540px; height: 236px; transform-origin: 0 100%; transform: scale(var(--s, 1));
    pointer-events: none;
  }
  .lt .photo {
    position: absolute; left: 0; bottom: 0; width: 176px; height: 236px; z-index: 3;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .lt .photo img { max-width: 100%; max-height: 100%; object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 6px 12px rgba(0,0,0,.55)); }
  .lt .photo svg { width: 130px; height: 180px; opacity: .6; }
  .lt .plate {
    position: absolute; left: 112px; right: 0; bottom: 0; height: 136px; z-index: 2; overflow: hidden;
    padding: 12px 16px 0 82px;
    background:
      linear-gradient(100deg, rgba(var(--c-rgb), .32), transparent 55%),
      linear-gradient(180deg, rgba(23,61,41,.9), rgba(10,29,19,.96)),
      url(/assets/clouds.jpg) center / 520px auto;
    border-top: 3px solid var(--gold); border-bottom: 3px solid var(--gold);
    box-shadow: inset 0 3px 0 var(--green-900), inset 0 4px 0 rgba(214,189,134,.45), 0 8px 22px rgba(0,0,0,.45);
    clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
  }
  .lt .plate::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: rgb(var(--c-rgb)); }
  .team { display: flex; align-items: center; gap: 8px; font: 800 12px/1 var(--font); letter-spacing: .14em; color: var(--gold); text-transform: uppercase; white-space: nowrap; }
  .team img { width: 22px; height: 22px; object-fit: contain; }
  .pname { margin-top: 7px; font: 900 30px/1 var(--font); letter-spacing: .01em; text-transform: uppercase; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 9px; }
  .pname .c { flex: none; font: 900 12px/20px var(--font); width: 22px; height: 20px; text-align: center; border-radius: 4px; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: var(--green-900); letter-spacing: 0; }
  .heroline { margin-top: 7px; display: flex; align-items: center; gap: 8px; font: 700 13px/1 var(--font); color: var(--gold-hi); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  .heroline img { width: 44px; height: 25px; object-fit: cover; border: 1px solid rgba(214,189,134,.7); border-radius: 2px; }
  .heroline .lvl { color: var(--gold); }
  .stats { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; display: flex; align-items: center; gap: 16px; padding: 0 30px 0 82px; background: rgba(5,16,10,.6); border-top: 1px solid rgba(214,189,134,.35); }
  .stats span { font: 700 11px/1 var(--font); letter-spacing: .1em; color: var(--gold); white-space: nowrap; }
  .stats b { font: 900 15px/1 var(--font); color: var(--cream); letter-spacing: .02em; margin-left: 5px; font-variant-numeric: tabular-nums; }
  .stats.none { display: none; }
  /* photo only (default): just the player's picture beside the hero portrait */
  body.photo-only .plate { display: none; }
  body.photo-only .lt .photo img { filter: drop-shadow(0 4px 10px rgba(0,0,0,.6)); }

  /* ---------- switch animation ---------- */
  .lt { opacity: 0; }
  .lt.show { opacity: 1; }
  .lt.show .plate { animation: wipe .5s cubic-bezier(.16,1,.3,1) both; }
  .lt.show .photo { animation: rise .55s .08s cubic-bezier(.16,1,.3,1) both; }
  .lt.show .pname span { animation: widen .6s .2s cubic-bezier(.16,1,.3,1) both; display: inline-block; }
  .lt.show .heroline, .lt.show .stats, .lt.show .team { animation: fadeUp .4s .3s ease-out both; }
  .lt.leave { opacity: 0; transition: opacity .18s ease-in; }
  .lt.leave .photo { transform: translateY(20px); transition: transform .18s ease-in; }
  @keyframes wipe   { from { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); } to { clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%); } }
  @keyframes rise   { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: none; } }
  @keyframes widen  { from { opacity: 0; letter-spacing: .4em; } to { opacity: 1; letter-spacing: .01em; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- team names beside Dota's top bar (Radiant left, Dire right) ---------- */
  .tn { position: absolute; top: var(--nt, 2px); height: 44px; display: flex; align-items: center; padding: 0 22px;
    font: 900 26px/1 var(--font); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.8); opacity: 0; transition: opacity .4s; }
  .tn.l { right: calc(1920px - var(--nl, 572px)); background: linear-gradient(90deg, transparent, rgba(5,10,20,.78) 30%); }
  .tn.r { left: var(--nr, 1348px); background: linear-gradient(270deg, transparent, rgba(5,10,20,.78) 30%); }
  .tn.on { opacity: 1; }

  /* ---------- day/night panel beside the shop: the sun sets and the moon rises with Dota's clock ---------- */
  .dn { position: absolute; left: var(--dx, 1222px); top: var(--dy, 986px); width: var(--dw, 236px); height: var(--dh, 94px);
    overflow: hidden; border-radius: 6px; border: 1px solid rgba(var(--c-rgb), .55); box-shadow: 0 4px 14px rgba(0,0,0,.5); background: #0b1430; }
  .dn .sky { position: absolute; inset: 0; transition: opacity 1.8s; }
  .dn .sky.day { background: linear-gradient(180deg, #4f9fdc, #9fd0f0 60%, #f6d38a); }
  .dn .sky.night { background: linear-gradient(180deg, #070d24, #1d2c5e); opacity: 0; }
  .dn .stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1.8s; background-image:
    radial-gradient(1.5px 1.5px at 12% 30%, #fff, transparent), radial-gradient(1px 1px at 28% 62%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 44% 18%, #fff, transparent), radial-gradient(1px 1px at 70% 40%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 86% 22%, #fff, transparent), radial-gradient(1px 1px at 92% 70%, #fff, transparent);
    animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { filter: brightness(.5); } }
  .dn .wheel { position: absolute; left: 50%; top: calc(100% + 24px); width: 150px; height: 150px; margin: -75px 0 0 -75px;
    transition: transform 1.8s cubic-bezier(.6,0,.3,1); }
  .dn .wheel i { position: absolute; left: 50%; width: 38px; height: 38px; margin-left: -19px; border-radius: 50%; }
  .dn .sun { top: 0; background: radial-gradient(circle at 40% 40%, #fff6c8, #ffc94a 60%, #f39a1e); box-shadow: 0 0 22px #ffd36a; }
  .dn .moon { bottom: 0; transform: rotate(180deg); background: radial-gradient(circle at 35% 35%, #ffffff, #d9e2f2 60%, #a9b8d6); box-shadow: 0 0 18px #bcd0ff; }
  .dn .moon::after { content: ""; position: absolute; left: 9px; top: 7px; width: 26px; height: 26px; border-radius: 50%; background: rgba(120,140,180,.35); }
  .dn b { position: absolute; left: 10px; bottom: 7px; font: 900 13px/1 var(--font); letter-spacing: .25em; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .dn.night .sky.day { opacity: 0; } .dn.night .sky.night, .dn.night .stars { opacity: 1; }
  .dn.night .wheel { transform: rotate(180deg); }
  .dn.off { display: none; }

  /* ---------- frame + name for the cropped player cam (the cam itself is the Studio auto cam source in OBS, under this hole) ---------- */
  .camf { position: absolute; left: var(--cx, 312px); top: var(--cy, 872px); width: var(--cw, 250px); height: var(--ch, 208px);
    border: 2px solid rgba(var(--c-rgb), .9); box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.5); opacity: 0; transition: opacity .3s; }
  .camf.on { opacity: 1; }
  .camf .cn { position: absolute; left: -2px; bottom: 100%; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: rgba(8,14,24,.92); border: 2px solid rgba(var(--c-rgb), .9); border-bottom: 0; white-space: nowrap; }
  .camf .cn b { font: 800 15px/1 var(--font); color: #fff; }
  .camf .cn span { font: 800 11px/1 var(--font); letter-spacing: .14em; color: rgb(var(--c-rgb)); }
</style>
</head>
<body>
<div class="canvas">
  <div class="lt" id="lt">
    <div class="plate">
      <div class="team" id="team"></div>
      <div class="pname" id="pname"></div>
      <div class="heroline" id="hero"></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="photo" id="photo"></div>
  </div>
  <div class="tn l" id="tnL"></div><div class="tn r" id="tnR"></div>
  <div class="dn" id="dn"><div class="sky day"></div><div class="sky night"></div><div class="stars"></div>
    <div class="wheel"><i class="sun"></i><i class="moon"></i></div><b id="dnTxt">SIANG</b></div>
  <div class="camf" id="camf"><div class="cn"><b id="camName"></b><span id="camTag"></span></div></div>
</div>
<script src="/sfx.js"></script>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  if (qs.has('bg')) document.body.classList.add('preview');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const hexToRgb = (hex) => { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '214, 189, 134'; const n = parseInt(m[1], 16); return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`; };
  const SILHOUETTE = '<svg viewBox="0 0 130 180"><circle cx="65" cy="52" r="34" fill="#d6bd86"/><path d="M5 180 C8 118 36 98 65 98 C94 98 122 118 125 180 Z" fill="#d6bd86"/></svg>';
  const kfmt = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 1 : 2).replace(/\.?0+$/, '') + 'k' : String(n);

  let heroes = new Map();
  let shownKey = null;
  let swapTimer = null;
  let booted = false;          // no sound when OBS first loads the source

  function fit() {
    document.documentElement.style.setProperty('--fit', Math.min(innerWidth / 1920, innerHeight / 1080).toFixed(4));
  }
  addEventListener('resize', fit); fit();

  function fillCard(c) {
    const lt = $('lt');
    lt.style.setProperty('--c-rgb', hexToRgb(c.teamColor));
    $('team').innerHTML = (c.teamLogo ? `<img src="${esc(c.teamLogo)}" alt="" onerror="this.remove()">` : '') + esc(c.teamName || '');
    $('pname').innerHTML = (c.captain ? '<i class="c">C</i>' : '') + `<span>${esc(c.name)}</span>`;
    $('photo').innerHTML = c.photo ? `<img src="${esc(c.photo)}" alt="">` : SILHOUETTE;
    const img = $('photo').querySelector('img'); if (img) img.onerror = () => { $('photo').innerHTML = SILHOUETTE; };
    updateLive(c);
  }
  function updateLive(c) {
    const h = c.heroId != null ? heroes.get(c.heroId) : null;
    $('hero').innerHTML = h ? `<img src="/img/icon/${h.slug}" alt="" onerror="this.remove()">${esc(h.name)}${c.stats && c.stats.level ? ` <span class="lvl">· LVL ${c.stats.level}</span>` : ''}` : '';
    const st = $('stats');
    if (c.stats) {
      const html = `<span>K/D/A<b>${c.stats.kills}/${c.stats.deaths}/${c.stats.assists}</b></span><span>GPM<b>${c.stats.gpm}</b></span><span>NET WORTH<b>${kfmt(c.stats.netWorth)}</b></span>`;
      if (st._html !== html) { st.innerHTML = html; st._html = html; }
      st.classList.remove('none');
    } else st.classList.add('none');
  }

  // positions on the 1920x1080 canvas, set in the OBS source URL to match the caster's HUD layout:
  // ?names=<left name ends at x>,<right name starts at x>,<top>  ?dn=x,y,w,h  (?dn=0 hides the day/night panel)
  // the cam frame follows the Player cam panel's position
  const root = document.documentElement.style;
  const nums = (k) => (qs.get(k) || '').split(',').map(Number).filter((n) => Number.isFinite(n));
  { const [l, r, t] = nums('names'); if (l) root.setProperty('--nl', l + 'px'); if (r) root.setProperty('--nr', r + 'px'); if (t != null) root.setProperty('--nt', t + 'px'); }
  { const v = nums('dn'); if (v.length === 4) ['--dx', '--dy', '--dw', '--dh'].forEach((n, i) => root.setProperty(n, v[i] + 'px')); }
  if (qs.get('dn') === '0') $('dn').classList.add('off');

  function applyExtras(S) {
    const rad = S.radiantSide === 'right' ? 'right' : 'left', dire = rad === 'left' ? 'right' : 'left';
    for (const [id, side] of [['tnL', rad], ['tnR', dire]]) {   // Dota's top bar: Radiant left, Dire right
      const n = (S.teams && S.teams[side] && S.teams[side].name) || '';
      if ($(id).textContent !== n) $(id).textContent = n;
      $(id).classList.toggle('on', !!n);
    }
    const night = !!S.night;
    $('dn').classList.toggle('night', night);
    $('dnTxt').textContent = night ? 'MALAM' : 'SIANG';
    const pc = S.playerCam || {};                                // same box as the Player cam panel (x, y, w, aspect)
    if (pc.w) {
      const [aw, ah] = String(pc.aspect || '16:9').split(':').map(Number);
      root.setProperty('--cx', pc.x + 'px'); root.setProperty('--cy', pc.y + 'px');
      root.setProperty('--cw', pc.w + 'px'); root.setProperty('--ch', Math.round(pc.w * (ah || 9) / (aw || 16)) + 'px');
    }
    const cs = S.camSel;
    $('camf').classList.toggle('on', !!(cs && cs.name));
    if (cs && cs.name) { $('camName').textContent = cs.name; $('camTag').textContent = cs.tag || cs.team || ''; }
  }

  function apply(S) {
    applyExtras(S);
    SFX.config(S.sfx, false);
    const lt = $('lt');
    const ic = S.ingameCard || {};
    lt.style.setProperty('--x', (ic.x ?? 300) + 'px');
    lt.style.setProperty('--y', (ic.y ?? 8) + 'px');
    lt.style.setProperty('--s', ic.scale ?? 1);
    const photoOnly = (ic.style || 'photo') !== 'full';
    document.body.classList.toggle('photo-only', photoOnly);
    // photo only: a player without a photo shows nothing
    const c = S.card && (!photoOnly || S.card.photo) ? S.card : null;
    const key = c ? c.key + (photoOnly ? '|p' : '|f') : null;
    const wasBooted = booted; booted = true;
    if (key === shownKey) { if (c) updateLive(c); return; }
    clearTimeout(swapTimer);
    const prev = shownKey;
    if (prev) { lt.classList.remove('show'); lt.classList.add('leave'); }
    shownKey = key;
    swapTimer = setTimeout(() => {
      lt.classList.remove('leave');
      if (!c) return;
      fillCard(c);
      void lt.offsetWidth;
      lt.classList.add('show');
      if (wasBooted) SFX.play('ingame');
    }, prev ? 190 : 0);
  }

  fetch('/api/heroes').then((r) => r.json()).then((list) => {
    heroes = new Map(list.map((h) => [h.id, h]));
    const es = new EventSource('/events');
    es.onmessage = (e) => { try { apply(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  }).catch(() => setTimeout(() => location.reload(), 3000));
})();
</script>
</body>
</html>
