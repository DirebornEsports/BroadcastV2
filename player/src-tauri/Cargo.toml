[package]
name = "direborn-cam"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39" # same version tauri/wry use: auto-allow the camera prompt
